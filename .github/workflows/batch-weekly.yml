name: 주간 배치 - WTI 유가

on:
  schedule:
    - cron: '0 17 * * 0'   # 매주 월요일 02:00 KST (일요일 UTC 17:00)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  batch:
    name: WTI 유가 적재
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: forecastai/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: forecastai

      - name: WTI 배치 실행
        run: node scripts/batch-weekly.mjs
        working-directory: forecastai
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
