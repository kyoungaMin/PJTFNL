name: 일간 배치 - BDI

on:
  schedule:
    - cron: '0 16 * * *'   # 매일 01:00 KST (UTC+9 → UTC 16:00)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  batch:
    name: BDI 적재
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: forecastai/package-lock.json

      - name: 패키지 설치
        run: npm ci
        working-directory: forecastai

      - name: BDI 배치 실행
        run: node scripts/batch-daily.mjs
        working-directory: forecastai
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
